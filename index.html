<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link href="https://cdn.jsdelivr.net/gh/fontalternative/glacial-indifference/font.css" rel="stylesheet" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/favicon-32.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="theme-color" content="#6D28D9" />
    <meta name="description" content="Klasoo — Plateforme internationale de gestion scolaire. Élèves, notes, présences, finances et communication, réunis pour administrateurs, enseignants, parents et élèves, partout dans le monde." />
    <title>Klasoo — Plateforme Scolaire</title>
  </head>
  <body class="bg-slate-50">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            // Check for a newer service worker on every load, and reload the
            // page automatically once it takes control — otherwise a visitor
            // could stay stuck on an old cached version indefinitely after a
            // new deploy, even though the server already has the latest code.
            reg.update().catch(() => {});
            let refreshed = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
              if (refreshed) return;
              refreshed = true;
              window.location.reload();
            });
          }).catch(() => {});
        });
      }
    </script>
  </body>
</html>
